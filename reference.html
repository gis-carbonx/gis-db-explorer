<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIS Data Classification Reference</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #08245c; --navy2: #103a87;
    --blue: #1E5AA0; --mid: #3A7DC9;
    --light: #D5E8FA; --pale: #F0F6FF;
    --text: #1A2B40; --muted: #5A7A9A; --border: #C8DDEF;
    --white: #FFFFFF; --bg: #F5F8FC;
  }
  body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── HEADER ── */
  header {
    height: 76px;
    background: linear-gradient(90deg, var(--navy), var(--navy2));
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 26px;
    color: white;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 14px rgba(0,0,0,.2);
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo-img { height: 42px; width: auto; object-fit: contain; }
  .title-wrap h1 { font-size: 18px; font-weight: 700; margin-bottom: 2px; }
  .title-wrap p { font-size: 13px; opacity: .9; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .back-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 8px;
    border: 1.5px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.08);
    color: #fff; font-size: 13px; font-weight: 600;
    text-decoration: none; font-family: 'Inter', sans-serif;
    transition: background .15s, border-color .15s;
  }
  .back-btn:hover { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.5); }
  .back-btn svg { flex-shrink: 0; }

  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,.5); pointer-events: none; }
  #search {
    padding: 8px 14px 8px 36px;
    border: 1.5px solid rgba(255,255,255,.2);
    border-radius: 8px;
    background: rgba(255,255,255,.1);
    color: #fff;
    font-size: .875rem;
    width: 230px;
    outline: none;
    font-family: 'Inter', sans-serif;
    transition: border .2s, background .2s;
  }
  #search::placeholder { color: rgba(255,255,255,.4); }
  #search:focus { border-color: var(--mid); background: rgba(255,255,255,.16); }

  /* ── FILTER TABS ── */
  .filter-row { display: flex; gap: 8px; padding: 14px 40px 2px; flex-wrap: wrap; }
  .tab {
    padding: 5px 14px; border-radius: 20px; border: 1.5px solid var(--border);
    background: var(--white); color: var(--blue); font-size: .78rem; font-weight: 600;
    cursor: pointer; transition: all .15s; user-select: none;
    font-family: 'Inter', sans-serif;
  }
  .tab:hover { background: var(--light); }
  .tab.active { background: var(--navy); color: #fff; border-color: var(--navy); }

  .stats { display: flex; gap: 16px; padding: 8px 40px; border-bottom: 1px solid var(--border); background: var(--white); font-size: .76rem; color: var(--muted); flex-wrap: wrap; align-items: center; }
  .stats strong { color: var(--navy); }
  .refresh-btn {
    margin-left: auto; padding: 4px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--white);
    color: var(--blue); font-size: .72rem; font-weight: 600;
    cursor: pointer; font-family: 'Inter', sans-serif;
    transition: background .15s;
  }
  .refresh-btn:hover { background: var(--light); }

  main { padding: 20px 40px 60px; }

  /* Loading state */
  .loading-wrap { text-align: center; padding: 80px 20px; color: var(--muted); }
  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--light);
    border-top-color: var(--blue); border-radius: 50%;
    animation: spin .7s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .section-block { margin-bottom: 32px; }
  .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
  .section-title { font-size: .68rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .section-line { flex: 1; height: 1px; background: var(--border); }
  .section-count { font-size: .68rem; color: var(--muted); background: var(--light); padding: 2px 8px; border-radius: 10px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; align-items: start; }

  .card {
    background: var(--white); border: 1.5px solid var(--border); border-radius: 11px;
    padding: 14px 16px; cursor: pointer;
    transition: box-shadow .15s, border-color .15s, transform .1s;
    position: relative; overflow: hidden;
  }
.card:hover { box-shadow: 0 4px 18px rgba(30,90,160,.12); border-color: var(--mid); transform: translateY(-1px); }
.card.expanded { border-color: var(--blue); box-shadow: 0 5px 22px rgba(13,54,99,.14); }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card-name { font-size: .88rem; font-weight: 600; color: var(--text); line-height: 1.35; }
  .card-right { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
  .card-code {
    background: var(--navy); color: #fff; font-size: .68rem; font-weight: 700;
    letter-spacing: .06em; padding: 3px 9px; border-radius: 6px;
    font-family: 'Courier New', monospace;
  }
  .chevron { width: 15px; height: 15px; color: var(--muted); transition: transform .2s; flex-shrink: 0; }
  .card.expanded .chevron { transform: rotate(180deg); }

  .card-preview { font-size: .76rem; color: var(--muted); margin-top: 5px; line-height: 1.5; }

  .card-detail { display: none; margin-top: 11px; padding-top: 11px; border-top: 1px solid var(--border); }
  .card.expanded .card-detail { display: block; }
  .detail-label { font-size: .63rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
  .detail-desc { font-size: .76rem; color: var(--text); line-height: 1.55; margin-bottom: 10px; }
  .detail-examples { display: flex; flex-wrap: wrap; gap: 5px; }
  .example-tag { background: var(--pale); border: 1px solid var(--light); color: var(--blue); font-size: .74rem; padding: 3px 10px; border-radius: 6px; line-height: 1.4; }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); display: none; }
  .empty.show { display: block; }

  mark { background: #FFF176; color: inherit; border-radius: 2px; padding: 0 1px; }

  @media (max-width: 600px) {
    header { padding: 0 16px; }
    .filter-row, main, .stats { padding-left: 16px; padding-right: 16px; }
    #search { width: 170px; }
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <img src="data/cx_white.png" class="logo-img" onerror="this.style.display='none'">
    <div class="title-wrap">
      <h1>GIS DATA CLASSIFICATION REFERENCE</h1>
      <p>CarbonX – Kode, kategori, dan contoh data geospasial</p>
    </div>
  </div>
  <div class="header-right">
    <a href="https://gis-carbonx.github.io/gis-db-explorer/" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Back to Explorer
    </a>
    <div class="search-wrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="Cari nama, kode, contoh…" autocomplete="off">
    </div>
  </div>
</header>

<div class="stats" id="stats">
  <span>Memuat data…</span>
</div>
<div class="filter-row" id="filters"></div>
<main id="main">
  <div class="loading-wrap">
    <div class="spinner"></div>
    <div>Memuat data dari Google Sheets…</div>
  </div>
</main>

<script>
// ── CONFIG ──────────────────────────────────────────────────
const SHEET_ID   = '1Os3rvfP1w4kZkMjGJ_vk3A5ucOeXp15aamysSltuij8';
const SHEET_GID  = '0';        // gid dari URL spreadsheet (tab pertama = 0)
const SHEET_NAME = 'index';    // nama tab sebagai fallback

// Dua URL dicoba secara berurutan
const SHEET_URLS = [
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${SHEET_GID}`,
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`,
];

// Warna per Level 1 (bisa ditambah sesuai kebutuhan)
const SECTION_COLORS = {
  // keys from "index" sheet kolom screenshot (Level 1)
  'Admin':          '#22843A',
  'Basemap':        '#0D3663',
  'Thematic':       '#1E5AA0',
  'Templates':      '#5A3FA0',
  // keys from GIS Explorer sheet (kolom l1)
  '01_Admin':       '#22843A',
  '02_Basemap':     '#0D3663',
  '03_Thematic':    '#1E5AA0',
  '04_Templates':   '#5A3FA0',
};
const DEFAULT_COLOR = '#3A7DC9';

// ── STATE ───────────────────────────────────────────────────
let SECTIONS      = {};
let activeFilter  = 'Semua';
let searchTerm    = '';

// ── CSV PARSER ──────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = splitRow(lines[0]).map(h => h.trim().replace(/^"|"$/g, ''));
  return lines.slice(1).map(line => {
    const vals = splitRow(line);
    const obj  = {};
    headers.forEach((h, i) => { obj[h] = (vals[i] || '').trim().replace(/^"|"$/g, ''); });
    return obj;
  });
}

function splitRow(row) {
  const res = []; let cur = '', inQ = false;
  for (const c of row) {
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { res.push(cur); cur = ''; }
    else { cur += c; }
  }
  res.push(cur);
  return res;
}

// ── BUILD SECTIONS FROM SHEET DATA ──────────────────────────
// Supports both column naming conventions:
//   "index" sheet (classification): Level 1, Level 2, Code, Deskripsi, Level 3
//   GIS Explorer sheet: l1, l2, l3, desc (no separate Code column)
function buildSections(rows) {
  const sections = {};
  rows.forEach(row => {
    // Support both column name styles
    const l1   = row['Level 1']   || row['level_1'] || row['l1'] || '';
    const l2   = row['Level 2']   || row['level_2'] || row['l2'] || '';
    const code = row['Code']      || row['code']    || '';
    const desc = row['Deskripsi'] || row['deskripsi']|| row['desc'] || row['description'] || '';
    const l3   = row['Level 3']   || row['level_3'] || row['l3'] || '';

    if (!l1) return;

    // Strip numeric prefix from l1 for clean display: "02_Basemap" → "Basemap"
    const l1Display = l1.replace(/^\d+_/, '');

    if (!sections[l1Display]) {
      sections[l1Display] = {
        color: SECTION_COLORS[l1] || SECTION_COLORS[l1Display] || DEFAULT_COLOR,
        items: {}
      };
    }

    const itemKey = `${l2}||${code || l2}`;
    if (!sections[l1Display].items[itemKey]) {
      sections[l1Display].items[itemKey] = {
        name: l2,
        code: code,
        desc: desc,
        examples: []
      };
    }

    // Avoid duplicate l3 entries (same dataset appears multiple times)
    if (l3 && !sections[l1Display].items[itemKey].examples.includes(l3)) {
      sections[l1Display].items[itemKey].examples.push(l3);
    }
  });

  // Convert items objects to arrays
  const result = {};
  Object.entries(sections).forEach(([sName, sec]) => {
    result[sName] = {
      color: sec.color,
      items: Object.values(sec.items)
    };
  });
  return result;
}

// ── LOAD DATA ───────────────────────────────────────────────
async function loadData() {
  document.getElementById('main').innerHTML =
    '<div class="loading-wrap"><div class="spinner"></div><div>Memuat data dari Google Sheets…</div></div>';
  document.getElementById('stats').innerHTML = '<span>Memuat data…</span>';

  let lastErr = null;
  for (const url of SHEET_URLS) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      // Deteksi apakah response adalah halaman login Google (bukan CSV)
      if (text.trim().startsWith('<!') || text.includes('<html')) {
        throw new Error('Redirected to login page — spreadsheet not public');
      }
      const rows = parseCSV(text);
      if (!rows.length) throw new Error('CSV kosong');
      SECTIONS = buildSections(rows);
      buildFilters();
      render();
      return; // sukses, stop
    } catch (err) {
      console.warn(`Gagal dari ${url}:`, err.message);
      lastErr = err;
    }
  }

  // Semua URL gagal
  console.error('Semua URL gagal:', lastErr);
  document.getElementById('main').innerHTML =
    `<div class="empty show">
      <div style="font-size:2rem;opacity:.3;margin-bottom:10px">⚠️</div>
      <strong>Gagal memuat data dari Google Sheets.</strong><br>
      <span style="font-size:.8rem;color:#888;display:block;margin-top:6px;">Error: ${lastErr?.message || 'unknown'}</span>
      <span style="font-size:.8rem;display:block;margin-top:8px;">Pastikan spreadsheet sudah di-share <em>"Anyone with the link – Viewer"</em> dan nama tab sheet adalah <code>index</code>.</span>
      <button onclick="loadData()" style="margin-top:14px;padding:7px 18px;border-radius:8px;border:1.5px solid var(--border);background:var(--white);color:var(--blue);font-size:.8rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;">↻ Coba lagi</button>
    </div>`;
  document.getElementById('stats').innerHTML = '<span style="color:#dc2626">Gagal memuat data</span>';
}

// ── HIGHLIGHT ───────────────────────────────────────────────
function hl(text, q) {
  if (!q || !text) return text || '';
  return text.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'), '<mark>$1</mark>');
}

function matches(item, q) {
  if (!q) return true;
  const lq = q.toLowerCase();
  return (item.name  || '').toLowerCase().includes(lq)
      || (item.code  || '').toLowerCase().includes(lq)
      || (item.desc  || '').toLowerCase().includes(lq)
      || item.examples.some(e => e.toLowerCase().includes(lq));
}

// ── RENDER ───────────────────────────────────────────────────
function render() {
  const mainEl  = document.getElementById('main');
  const statsEl = document.getElementById('stats');
  mainEl.innerHTML = '';

  const total = Object.values(SECTIONS).flatMap(s => s.items).length;
  let totalVisible = 0, anyVisible = false;
  const sectionKeys = activeFilter === 'Semua' ? Object.keys(SECTIONS) : [activeFilter];

  sectionKeys.forEach(sName => {
    const sec   = SECTIONS[sName];
    if (!sec) return;
    const items = sec.items.filter(i => matches(i, searchTerm));
    if (!items.length) return;
    anyVisible = true;
    totalVisible += items.length;

    const block = document.createElement('div');
    block.className = 'section-block';
    block.innerHTML = `
      <div class="section-header">
        <span class="section-title" style="color:${sec.color}">${sName}</span>
        <span class="section-line"></span>
        <span class="section-count">${items.length} kategori</span>
      </div>
      <div class="cards" id="grid-${sName.replace(/\s+/g,'-')}"></div>
    `;
    mainEl.appendChild(block);

    const grid = block.querySelector(`#grid-${sName.replace(/\s+/g,'-')}`);
    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.setProperty('--bar', sec.color);

      const preview = item.examples.length
        ? item.examples.slice(0,2).map(e => hl(e, searchTerm)).join(' · ')
        : (item.desc ? `<em>${hl(item.desc.substring(0,80), searchTerm)}…</em>` : '<em style="opacity:.45">—</em>');

      const tags = item.examples.length
        ? item.examples.map(e => `<span class="example-tag">${hl(e, searchTerm)}</span>`).join('')
        : '<span style="font-size:.74rem;opacity:.5">Belum ada level 3 terdaftar</span>';

      card.innerHTML = `
        <div class="card-top">
          <div class="card-name">${hl(item.name, searchTerm)}</div>
          <div class="card-right">
            <div class="card-code">${hl(item.code, searchTerm)}</div>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>
        <div class="card-detail">
          ${item.desc ? `<div class="detail-label">Deskripsi</div><div class="detail-desc">${hl(item.desc, searchTerm)}</div>` : ''}
          <div class="detail-label">Level 3 / Contoh data</div>
          <div class="detail-examples">${tags}</div>
        </div>
      `;
      card.addEventListener('click', () => {
        const isOpen = card.classList.contains('expanded');
        document.querySelectorAll('.card.expanded').forEach(c => c.classList.remove('expanded'));
        if (!isOpen) card.classList.add('expanded');
      });
      grid.appendChild(card);
    });
  });

  if (!anyVisible) {
    mainEl.innerHTML = `<div class="empty show"><div style="font-size:2rem;opacity:.3;margin-bottom:10px">🔍</div>Tidak ada hasil untuk "<strong>${searchTerm}</strong>"</div>`;
  }

  statsEl.innerHTML = `Menampilkan <strong>${totalVisible}</strong> dari <strong>${total}</strong> kategori`;
  if (searchTerm) statsEl.innerHTML += ` &nbsp;·&nbsp; Pencarian: "<strong>${searchTerm}</strong>"`;
  statsEl.innerHTML += `<button class="refresh-btn" onclick="loadData()">↻ Refresh</button>`;
}

// ── FILTERS ──────────────────────────────────────────────────
function buildFilters() {
  const row = document.getElementById('filters');
  row.innerHTML = '';
  ['Semua', ...Object.keys(SECTIONS)].forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (t === 'Semua' ? ' active' : '');
    btn.textContent = t;
    btn.addEventListener('click', () => {
      activeFilter = t;
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
    row.appendChild(btn);
  });
}

// ── SEARCH ───────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value.trim();
  if (searchTerm) {
    activeFilter = 'Semua';
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    const first = document.querySelector('.tab');
    if (first) first.classList.add('active');
  }
  render();
});

// ── INIT ─────────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
