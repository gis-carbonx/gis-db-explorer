<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GIS Data Explorer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{

--navy:#0d2b63;
--navy2:#153d87;

--blue:#2563eb;

--gray-50:#f9fafb;
--gray-100:#f3f4f6;
--gray-200:#e5e7eb;
--gray-300:#d1d5db;
--gray-400:#9ca3af;
--gray-500:#6b7280;
--gray-600:#4b5563;
--gray-700:#374151;
--gray-900:#111827;

--green:#16a34a;
--green-bg:#dcfce7;

--orange:#d97706;
--orange-bg:#fef3c7;

--red:#dc2626;
--red-bg:#fee2e2;

--purple:#7c3aed;
--purple-bg:#ede9fe;

--cyan:#0891b2;
--cyan-bg:#cffafe;

--radius:10px;

--shadow:
0 1px 3px rgba(0,0,0,.04);

--font:'Inter',sans-serif;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:var(--font);
background:var(--gray-100);
color:var(--gray-900);
}

header{

height:60px;

background:
linear-gradient(
90deg,
var(--navy),
var(--navy2)
);

display:flex;
align-items:center;
justify-content:space-between;

padding:0 22px;

color:white;

box-shadow:
0 2px 8px rgba(0,0,0,.15);

}

.h-left{
display:flex;
align-items:center;
gap:12px;
}

.logo-img{
height:30px;
width:auto;
object-fit:contain;
display:block;
}

.title{
font-size:16px;
font-weight:700;
letter-spacing:.2px;
}

.h-right{
font-size:13px;
opacity:.9;
}


.page{
max-width:1250px;
margin:auto;
padding:18px;
}

.toolbar{

background:white;

border:1px solid var(--gray-200);

border-radius:var(--radius);

padding:12px;

display:grid;

grid-template-columns:
1.5fr .8fr .8fr .8fr;

gap:10px;

margin-bottom:18px;

box-shadow:var(--shadow);

}

.toolbar input,
.toolbar select{

height:40px;

padding:0 12px;

border:1px solid var(--gray-300);

border-radius:8px;

font-size:12px;

font-family:var(--font);

outline:none;

background:white;

}

.toolbar input:focus,
.toolbar select:focus{
border-color:var(--blue);
}

.stats{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:12px;

margin-bottom:18px;

}

.stat-card{

background:white;

border:1px solid var(--gray-200);

border-radius:var(--radius);

padding:14px;

box-shadow:var(--shadow);

}

.stat-label{
font-size:11px;
color:var(--gray-500);
margin-bottom:4px;
}

.stat-value{
font-size:22px;
font-weight:700;
}

.dataset-list{
display:grid;
gap:10px;
}

.dataset-card{

background:white;

border:1px solid var(--gray-200);

border-radius:var(--radius);

padding:16px;

box-shadow:var(--shadow);

transition:.15s;

}

.dataset-card:hover{
border-color:#c7d2fe;
}

.dataset-top{
display:flex;
justify-content:space-between;
gap:16px;
margin-bottom:10px;
}

.dataset-main{
flex:1;
}

.dataset-category{

font-size:11px;

font-weight:600;

color:var(--gray-500);

margin-bottom:6px;

}

.dataset-title{

font-size:20px;

font-weight:600;

line-height:1.35;

margin-bottom:5px;

}

.dataset-title a{
text-decoration:none;
color:#1d4ed8;
}

.dataset-title a:hover{
text-decoration:underline;
}

.dataset-sub{

font-size:12px;

color:var(--gray-500);

margin-bottom:10px;

}

.dataset-desc{

font-size:13px;

line-height:1.7;

color:var(--gray-700);

}

.badges{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-top:12px;
}

.badge{

padding:4px 8px;

border-radius:999px;

font-size:10px;

font-weight:600;

}

.public{
background:var(--green-bg);
color:var(--green);
}

.internal{
background:#dbeafe;
color:#1d4ed8;
}

.restricted{
background:var(--orange-bg);
color:var(--orange);
}

.confidential{
background:var(--red-bg);
color:var(--red);
}

.vector{
background:var(--purple-bg);
color:var(--purple);
}

.raster{
background:var(--cyan-bg);
color:var(--cyan);
}

.dataset-meta{

display:flex;

flex-wrap:wrap;

gap:16px;

margin-top:14px;

padding-top:14px;

border-top:1px solid var(--gray-200);

font-size:12px;

color:var(--gray-600);

}

.meta-item strong{
color:var(--gray-900);
}

.dataset-action{
margin-left:auto;
display:flex;
align-items:flex-start;
}

.open-btn{

text-decoration:none;

background:var(--navy);

color:white;

padding:9px 14px;

border-radius:8px;

font-size:12px;

font-weight:600;

white-space:nowrap;

}

.empty{

background:white;

border:1px solid var(--gray-200);

border-radius:var(--radius);

padding:50px;

text-align:center;

color:var(--gray-500);

}

.footer{
margin-top:16px;
text-align:right;
font-size:11px;
color:var(--gray-500);
}

@media(max-width:1100px){

.toolbar{
grid-template-columns:1fr;
}

.stats{
grid-template-columns:1fr 1fr;
}

.dataset-top{
flex-direction:column;
}

}

@media(max-width:700px){

.stats{
grid-template-columns:1fr;
}

.dataset-title{
font-size:17px;
}

}

</style>
</head>

<body>

<header>

<div class="h-left">

<img
src="data/cx_white.png"
class="logo-img"
>

<div class="title">
GIS DATA EXPLORER
</div>

</div>

<div class="h-right">
Metadata Explorer
</div>

</header>

<div class="page">

<div class="toolbar">

<input
type="text"
id="searchInput"
placeholder="Search dataset, keyword, author..."
>

<select id="filterL1">
<option value="">All Category</option>
</select>

<select id="filterGeo">
<option value="">All Geometry</option>
</select>

<select id="filterAccess">
<option value="">All Access</option>
</select>

</div>

<div class="stats">

<div class="stat-card">
<div class="stat-label">Total Dataset</div>
<div class="stat-value" id="statTotal">0</div>
</div>

<div class="stat-card">
<div class="stat-label">Raster</div>
<div class="stat-value" id="statRaster">0</div>
</div>

<div class="stat-card">
<div class="stat-label">Vector</div>
<div class="stat-value" id="statVector">0</div>
</div>

<div class="stat-card">
<div class="stat-label">Public Dataset</div>
<div class="stat-value" id="statPublic">0</div>
</div>

</div>

<div class="dataset-list" id="datasetList">

<div class="empty">
Loading spreadsheet data...
</div>

</div>

<div class="footer">
GIS Explorer • GitHub Pages Ready
</div>

</div>

<script>

const SHEET_CSV =
'https://docs.google.com/spreadsheets/d/1Os3rvfP1w4kZkMjGJ_vk3A5ucOeXp15aamysSltuij8/export?format=csv';

let RAW_DATA = [];

async function loadData(){

try{

const response =
await fetch(SHEET_CSV);

const csv =
await response.text();

RAW_DATA =
csvToArray(csv);

populateFilters();

renderData(RAW_DATA);

updateStats(RAW_DATA);

}
catch(err){

console.error(err);

document.getElementById('datasetList').innerHTML = `
<div class="empty">
Failed to load spreadsheet
</div>
`;

}

}

function csvToArray(str){

const rows =
str.trim().split('\n');

const headers =
rows[0].split(',');

const data =
rows.slice(1).map(row=>{

const values =
splitCSV(row);

const obj = {};

headers.forEach((h,i)=>{
obj[h.trim()] =
values[i] || '';
});

return obj;

});

return data;

}

function splitCSV(row){

const result = [];

let current = '';

let insideQuotes = false;

for(let i=0;i<row.length;i++){

const char = row[i];

if(char === '"'){
insideQuotes = !insideQuotes;
}

else if(char === ',' && !insideQuotes){

result.push(current);

current = '';

}

else{
current += char;
}

}

result.push(current);

return result.map(v=>
v.replace(/^"|"$/g,'')
);

}

function renderData(data){

const container =
document.getElementById('datasetList');

if(data.length === 0){

container.innerHTML = `
<div class="empty">
No dataset found
</div>
`;

return;

}

container.innerHTML = '';

data.forEach(d=>{

container.innerHTML += `

<div class="dataset-card">

<div class="dataset-top">

<div class="dataset-main">

<div class="dataset-category">
${d.l2}
</div>

<div class="dataset-title">

<a
href="${d.file_link}"
target="_blank"
>
${d.file_name}
</a>

</div>

<div class="dataset-sub">
${d.author} • ${d.division}
</div>

<div class="dataset-desc">
${d.desc}
</div>

<div class="badges">

${accessBadge(d.access)}

${geoBadge(d.geo_type)}

</div>

<div class="dataset-meta">

<div class="meta-item">
<strong>Extent:</strong>
${d.extent}
</div>

<div class="meta-item">
<strong>CRS:</strong>
${d.crs}
</div>

<div class="meta-item">
<strong>Updated:</strong>
${d.date_of_update}
</div>

<div class="meta-item">
<strong>Keywords:</strong>
${d.keywords}
</div>

</div>

</div>

<div class="dataset-action">

<a
href="${d.file_link}"
target="_blank"
class="open-btn"
>
Open Dataset
</a>

</div>

</div>

</div>

`;

});

}

function accessBadge(v){

if(v.includes('Public')){
return `<span class="badge public">${v}</span>`;
}

if(v.includes('Internal')){
return `<span class="badge internal">${v}</span>`;
}

if(v.includes('Restricted')){
return `<span class="badge restricted">${v}</span>`;
}

if(v.includes('Confidential')){
return `<span class="badge confidential">${v}</span>`;
}

return `<span class="badge">${v}</span>`;

}

function geoBadge(v){

if(v.includes('Raster')){
return `<span class="badge raster">${v}</span>`;
}

return `<span class="badge vector">${v}</span>`;

}

function populateFilters(){

const l1Set =
[...new Set(
RAW_DATA.map(d=>d.l1).filter(Boolean)
)];

const geoSet =
[...new Set(
RAW_DATA.map(d=>d.geo_type).filter(Boolean)
)];

const accessSet =
[...new Set(
RAW_DATA.map(d=>d.access).filter(Boolean)
)];

const f1 =
document.getElementById('filterL1');

const fg =
document.getElementById('filterGeo');

const fa =
document.getElementById('filterAccess');

f1.innerHTML =
'<option value="">All Category</option>';

fg.innerHTML =
'<option value="">All Geometry</option>';

fa.innerHTML =
'<option value="">All Access</option>';

l1Set.forEach(v=>{
f1.innerHTML += `<option>${v}</option>`;
});

geoSet.forEach(v=>{
fg.innerHTML += `<option>${v}</option>`;
});

accessSet.forEach(v=>{
fa.innerHTML += `<option>${v}</option>`;
});

}

document
.getElementById('searchInput')
.addEventListener('input',applyFilters);

document
.getElementById('filterL1')
.addEventListener('change',applyFilters);

document
.getElementById('filterGeo')
.addEventListener('change',applyFilters);

document
.getElementById('filterAccess')
.addEventListener('change',applyFilters);

function applyFilters(){

const q =
document
.getElementById('searchInput')
.value
.toLowerCase();

const l1 =
document
.getElementById('filterL1')
.value;

const geo =
document
.getElementById('filterGeo')
.value;

const access =
document
.getElementById('filterAccess')
.value;

const filtered =
RAW_DATA.filter(d=>{

const text =
Object.values(d)
.join(' ')
.toLowerCase();

const matchSearch =
text.includes(q);

const matchL1 =
!l1 || d.l1 === l1;

const matchGeo =
!geo || d.geo_type === geo;

const matchAccess =
!access || d.access === access;

return (
matchSearch &&
matchL1 &&
matchGeo &&
matchAccess
);

});

renderData(filtered);

updateStats(filtered);

}

function updateStats(data){

document.getElementById('statTotal').innerText =
data.length;

document.getElementById('statRaster').innerText =
data.filter(d=>
d.geo_type.includes('Raster')
).length;

document.getElementById('statVector').innerText =
data.filter(d=>
!d.geo_type.includes('Raster')
).length;

document.getElementById('statPublic').innerText =
data.filter(d=>
d.access.includes('Public')
).length;

}

loadData();

</script>

</body>
</html>
