<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GIS Metadata Explorer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{

--navy:#0c234a;
--navy2:#143a7b;
--blue:#2563eb;

--green:#16a34a;
--green-soft:#dcfce7;

--orange:#f59e0b;
--orange-soft:#fef3c7;

--red:#dc2626;
--red-soft:#fee2e2;

--gray-50:#f9fafb;
--gray-100:#f3f4f6;
--gray-200:#e5e7eb;
--gray-300:#d1d5db;
--gray-400:#9ca3af;
--gray-500:#6b7280;
--gray-700:#374151;
--gray-900:#111827;

--white:#ffffff;

--shadow:0 2px 10px rgba(0,0,0,.05);

--radius:10px;

--font:'Inter',sans-serif;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:var(--font);
background:var(--gray-100);
color:var(--gray-900);
}

header{
height:62px;
background:linear-gradient(90deg,var(--navy),var(--navy2));
display:flex;
align-items:center;
justify-content:space-between;
padding:0 24px;
color:white;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}

.h-left{
display:flex;
align-items:center;
gap:12px;
}

.logo{
font-size:24px;
}

.title{
font-size:16px;
font-weight:700;
letter-spacing:.3px;
}

.subtitle{
font-size:11px;
opacity:.8;
margin-top:2px;
}

.h-right{
font-size:13px;
opacity:.9;
}

.page{
max-width:1380px;
margin:auto;
padding:20px;
}

.toolbar{

background:white;

padding:14px;

border-radius:var(--radius);

border:1px solid var(--gray-200);

display:grid;

grid-template-columns:1.5fr .8fr .8fr .8fr auto;

gap:10px;

margin-bottom:18px;

box-shadow:var(--shadow);

}

.toolbar input,
.toolbar select{

padding:9px 11px;

border:1px solid var(--gray-300);

border-radius:8px;

font-size:12px;

font-family:var(--font);

outline:none;

background:white;

}

.toolbar input:focus,
.toolbar select:focus{
border-color:var(--blue);
}

.btn{
background:var(--navy);
color:white;
border:none;
padding:9px 14px;
border-radius:8px;
cursor:pointer;
font-size:12px;
font-weight:600;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
margin-bottom:18px;
}

.stat-card{
background:white;
padding:14px 16px;
border-radius:var(--radius);
border:1px solid var(--gray-200);
box-shadow:var(--shadow);
}

.stat-label{
font-size:11px;
color:var(--gray-500);
margin-bottom:5px;
}

.stat-value{
font-size:22px;
font-weight:700;
}

.dataset-list{
display:grid;
gap:12px;
}

.dataset-card{

background:white;

border:1px solid var(--gray-200);

border-radius:var(--radius);

padding:16px 18px;

box-shadow:var(--shadow);

transition:.15s;

}

.dataset-card:hover{
transform:translateY(-1px);
}

.dataset-type{
font-size:11px;
font-weight:600;
color:var(--gray-500);
margin-bottom:6px;
}

.dataset-title{
font-size:18px;
font-weight:600;
color:#1d4ed8;
line-height:1.3;
margin-bottom:4px;
}

.dataset-sub{
font-size:12px;
color:var(--gray-500);
margin-bottom:10px;
}

.dataset-desc{
font-size:13px;
line-height:1.6;
color:var(--gray-700);
margin-bottom:12px;
}

.badges{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-bottom:12px;
}

.badge{
padding:4px 8px;
border-radius:999px;
font-size:10px;
font-weight:600;
}

.public{
background:var(--green-soft);
color:#166534;
}

.internal{
background:#dbeafe;
color:#1d4ed8;
}

.restricted{
background:var(--orange-soft);
color:#92400e;
}

.confidential{
background:var(--red-soft);
color:#991b1b;
}

.vector{
background:#ede9fe;
color:#5b21b6;
}

.raster{
background:#cffafe;
color:#155e75;
}

.dataset-meta{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));

gap:8px;

margin-bottom:14px;

}

.meta-box{
background:var(--gray-50);
border:1px solid var(--gray-200);
border-radius:8px;
padding:10px;
}

.meta-label{
font-size:10px;
color:var(--gray-500);
margin-bottom:4px;
}

.meta-value{
font-size:12px;
font-weight:600;
word-break:break-word;
}

.dataset-bottom{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
flex-wrap:wrap;
padding-top:2px;
}

.bottom-left{
font-size:11px;
color:var(--gray-500);
line-height:1.6;
}

.bottom-actions{
display:flex;
gap:8px;
}

.action-btn{
text-decoration:none;
padding:8px 12px;
border-radius:7px;
font-size:12px;
font-weight:600;
}

.btn-primary{
background:var(--navy);
color:white;
}

.btn-outline{
background:white;
border:1px solid var(--gray-300);
color:var(--gray-700);
}

.empty{
background:white;
padding:45px;
text-align:center;
border-radius:var(--radius);
border:1px solid var(--gray-200);
color:var(--gray-500);
}

.footer{
margin-top:14px;
text-align:right;
font-size:11px;
color:var(--gray-500);
}

@media(max-width:1100px){

.toolbar{
grid-template-columns:1fr;
}

.stats{
grid-template-columns:1fr 1fr;
}

}

@media(max-width:700px){

.stats{
grid-template-columns:1fr;
}

.dataset-title{
font-size:16px;
}

}

</style>
</head>

<body>

<header>

<div class="h-left">

<div class="logo">🗂</div>

<div>

<div class="title">
GIS DATA EXPLORER
</div>

<div class="subtitle">
Metadata Catalog & Spatial Dataset Repository
</div>

</div>

</div>

<div class="h-right">
Metadata Explorer
</div>

</header>

<div class="page">

<div class="toolbar">

<input
type="text"
id="searchInput"
placeholder="Search dataset, keyword, author..."
>

<select id="filterL1">
<option value="">All Category</option>
</select>

<select id="filterGeo">
<option value="">All Geometry</option>
</select>

<select id="filterAccess">
<option value="">All Access</option>
</select>

<button class="btn" onclick="loadData()">
Refresh
</button>

</div>

<div class="stats">

<div class="stat-card">
<div class="stat-label">Total Dataset</div>
<div class="stat-value" id="statTotal">0</div>
</div>

<div class="stat-card">
<div class="stat-label">Raster Dataset</div>
<div class="stat-value" id="statRaster">0</div>
</div>

<div class="stat-card">
<div class="stat-label">Vector Dataset</div>
<div class="stat-value" id="statVector">0</div>
</div>

<div class="stat-card">
<div class="stat-label">Public Dataset</div>
<div class="stat-value" id="statPublic">0</div>
</div>

</div>

<div class="dataset-list" id="datasetList">

<div class="empty">
Loading spreadsheet data...
</div>

</div>

<div class="footer">
GIS Explorer
</div>

</div>

<script>

const SHEET_CSV =
'https://docs.google.com/spreadsheets/d/1Os3rvfP1w4kZkMjGJ_vk3A5ucOeXp15aamysSltuij8/export?format=csv';

let RAW_DATA = [];

async function loadData(){

try{

const response = await fetch(SHEET_CSV);

const csv = await response.text();

RAW_DATA = csvToArray(csv);

populateFilters();

renderData(RAW_DATA);

updateStats(RAW_DATA);

}
catch(err){

console.error(err);

document.getElementById('datasetList').innerHTML = `
<div class="empty">
Failed to load spreadsheet data
</div>
`;

}

}

function csvToArray(str){

const rows = str.trim().split('\n');

const headers = rows[0].split(',');

const data = rows.slice(1).map(row=>{

const values = splitCSV(row);

const obj = {};

headers.forEach((h,i)=>{
obj[h.trim()] = values[i] || '';
});

return obj;

});

return data;

}

function splitCSV(row){

const result = [];

let current = '';

let insideQuotes = false;

for(let i=0;i<row.length;i++){

const char = row[i];

if(char === '"'){
insideQuotes = !insideQuotes;
}

else if(char === ',' && !insideQuotes){

result.push(current);

current = '';

}

else{
current += char;
}

}

result.push(current);

return result.map(v=>v.replace(/^"|"$/g,''));

}

function renderData(data){

const container =
document.getElementById('datasetList');

if(data.length === 0){

container.innerHTML = `
<div class="empty">
No dataset found
</div>
`;

return;

}

container.innerHTML = '';

data.forEach(d=>{

container.innerHTML += `

<div class="dataset-card">

<div class="dataset-type">
Dataset
</div>

<div class="dataset-title">
${d.file_name}
</div>

<div class="dataset-sub">
${d.l2}
</div>

<div class="dataset-desc">
${d.desc}
</div>

<div class="badges">

${accessBadge(d.access)}

${geoBadge(d.geo_type)}

</div>

<div class="dataset-meta">

<div class="meta-box">
<div class="meta-label">Geographic Extent</div>
<div class="meta-value">${d.extent}</div>
</div>

<div class="meta-box">
<div class="meta-label">Coordinate System</div>
<div class="meta-value">${d.crs}</div>
</div>

<div class="meta-box">
<div class="meta-label">Data Source</div>
<div class="meta-value">${d.data_source}</div>
</div>

<div class="meta-box">
<div class="meta-label">Keywords</div>
<div class="meta-value">${d.keywords}</div>
</div>

</div>

<div class="dataset-bottom">

<div class="bottom-left">

<strong>Author:</strong> ${d.author}<br>

<strong>Division:</strong> ${d.division}<br>

<strong>Updated:</strong> ${d.date_of_update}

</div>

<div class="bottom-actions">

<a
href="${d.file_link}"
target="_blank"
class="action-btn btn-primary"
>
Open Dataset
</a>

</div>

</div>

</div>

`;

});

}

function accessBadge(v){

if(v.includes('Public')){
return `<span class="badge public">${v}</span>`;
}

if(v.includes('Internal')){
return `<span class="badge internal">${v}</span>`;
}

if(v.includes('Restricted')){
return `<span class="badge restricted">${v}</span>`;
}

if(v.includes('Confidential')){
return `<span class="badge confidential">${v}</span>`;
}

return `<span class="badge">${v}</span>`;

}

function geoBadge(v){

if(v.includes('Raster')){
return `<span class="badge raster">${v}</span>`;
}

return `<span class="badge vector">${v}</span>`;

}

function populateFilters(){

const l1Set =
[...new Set(RAW_DATA.map(d=>d.l1).filter(Boolean))];

const geoSet =
[...new Set(RAW_DATA.map(d=>d.geo_type).filter(Boolean))];

const accessSet =
[...new Set(RAW_DATA.map(d=>d.access).filter(Boolean))];

const f1 =
document.getElementById('filterL1');

const fg =
document.getElementById('filterGeo');

const fa =
document.getElementById('filterAccess');

f1.innerHTML =
'<option value="">All Category</option>';

fg.innerHTML =
'<option value="">All Geometry</option>';

fa.innerHTML =
'<option value="">All Access</option>';

l1Set.forEach(v=>{
f1.innerHTML += `<option>${v}</option>`;
});

geoSet.forEach(v=>{
fg.innerHTML += `<option>${v}</option>`;
});

accessSet.forEach(v=>{
fa.innerHTML += `<option>${v}</option>`;
});

}

document
.getElementById('searchInput')
.addEventListener('input',applyFilters);

document
.getElementById('filterL1')
.addEventListener('change',applyFilters);

document
.getElementById('filterGeo')
.addEventListener('change',applyFilters);

document
.getElementById('filterAccess')
.addEventListener('change',applyFilters);

function applyFilters(){

const q =
document
.getElementById('searchInput')
.value
.toLowerCase();

const l1 =
document
.getElementById('filterL1')
.value;

const geo =
document
.getElementById('filterGeo')
.value;

const access =
document
.getElementById('filterAccess')
.value;

const filtered = RAW_DATA.filter(d=>{

const text =
Object.values(d)
.join(' ')
.toLowerCase();

const matchSearch =
text.includes(q);

const matchL1 =
!l1 || d.l1 === l1;

const matchGeo =
!geo || d.geo_type === geo;

const matchAccess =
!access || d.access === access;

return (
matchSearch &&
matchL1 &&
matchGeo &&
matchAccess
);

});

renderData(filtered);

updateStats(filtered);

}
function updateStats(data){

document.getElementById('statTotal').innerText =
data.length;

document.getElementById('statRaster').innerText =
data.filter(d=>d.geo_type.includes('Raster')).length;

document.getElementById('statVector').innerText =
data.filter(d=>!d.geo_type.includes('Raster')).length;

document.getElementById('statPublic').innerText =
data.filter(d=>d.access.includes('Public')).length;

}

loadData();

</script>

</body>
</html>
